; Ajustes de dev para o Portal do Contador
memory_limit = 512M
max_execution_time = 120

; Upload de XML / lotes de documentos fiscais
upload_max_filesize = 64M
post_max_size = 80M
max_file_uploads = 200

; Datas / timezone do Brasil
date.timezone = America/Sao_Paulo

; Opcache (dev: revalida sempre para refletir edicoes)
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
