[BANCO]
DRIVERID=SQLite
SERVER=
PORT=
DATABASE=banco.sqlite
USER=
PASSWORD=

[BANCO_ERP]
; Firebird do ERP. Caminho PADRAO da instalacao (igual em todos os clientes);
; so mexer se o cliente tiver instalado o ERP fora do padrao.
; DATABASE vazio = canais do banco DESLIGADOS.
;
; ATENCAO: sem isto a NFS-e NAO reflete a verdade. A situacao da nota so existe
; de forma confiavel no NFSE_MASTER: ha nota CANCELADA no ERP cujo XML continua
; dizendo "Emitida", e nota recente que nem chega a ter arquivo na pasta.
SERVER=localhost
PORT=3050
DATABASE=C:\Sistema\Dados\DADOS.FDB
USER=SYSDBA
PASSWORD=masterkey

[WEBSERVICE]
; Url e de CADA instalacao - preencher na mao (ou pela tela do agente).
; TEM de terminar com barra. Ex.: https://portal.seudominio.com.br/
; Enquanto estiver incompleta o agente NAO ENVIA NADA, de nenhum documento.
Url=https:
; Key: a CHAVE DO AGENTE, uma por instalacao. Ela sai do painel, no cadastro
; (ou na edicao) do usuario daquele cliente: copie o valor mostrado UMA vez e
; cole aqui. Sem ela o portal recusa e o agente registra a recusa no log.
;
; Vinha 'Sistema' ate 2026-07-30. Aquela chave e a mesma para todo mundo, esta
; publicada no repositorio e nao amarra o agente a nenhum CNPJ - por isso o
; portal novo ja nasce recusando. Instalacao ANTIGA que ainda usa 'Sistema'
; continua funcionando; troque pelo token quando puder.
Key=

[DATA]
; ===========================================================================
; COMO PREENCHER
; - Um campo aceita VARIOS caminhos na MESMA linha, separados por ";".
;   NAO quebre um campo em duas linhas: o agente le so a primeira.
; - Aponte sempre para as SUBPASTAS. A varredura e recursiva e desce sozinha
;   pelos niveis <CNPJ>\<AAMM> - nao precisa (nem deve) apontar para a raiz.
; - Campo em branco = "nao uso esse documento". O agente avisa no log a cada
;   varredura; preencher evita o aviso repetido.
; - Pasta que NAO EXISTE vira ERRO no log. Pasta que existe e esta vazia, nao.
; ===========================================================================

; --- NF-e (55) e NFC-e (65): notas autorizadas -----------------------------
nfenfce_upload_xml_1=C:\Sistema\NFe\Enviadas
nfenfce_upload_xml_2=C:\Sistema\NFCe\enviadas

; --- NF-e de ENTRADA / compras ---------------------------------------------
nfe_upload_xml_1=C:\Sistema\Xml_Compra

; --- NFS-e (servico): retorno autorizado + retorno do cancelamento ---------
; NUNCA aponte para a raiz C:\Sistema\NFSe: a varredura e recursiva e subiria
; tambem RPS\ e Consulta\, que nao sao nota.
nfse_upload_xml=C:\Sistema\NFSe\Enviadas
nfse_upload_xml_2=C:\Sistema\NFSe\Canceladas

; --- CT-e (57) e CT-e OS (67): conhecimentos autorizados -------------------
cte_upload_xml=C:\Sistema\CTe\Enviadas;C:\Sistema\CTeOs\Enviadas

; --- MDF-e (58) ------------------------------------------------------------
mdfe_upload_xml=C:\Sistema\MDFe\MDFe

; --- Eventos de NF-e / NFC-e (cancelamento, CC-e, manifestacao) ------------
events_upload_nfenfce_xml_1=C:\Sistema\NFe\Cancelamento;C:\Sistema\NFe\CCe;C:\Sistema\NFe\Evento;C:\Sistema\NFe\Xml
events_upload_nfenfce_xml_2=C:\Sistema\NFCe\Cancelamento;C:\Sistema\NFCe\Evento;C:\Sistema\NFCe\xml

; --- Eventos de CT-e / CT-e OS ---------------------------------------------
; Os campos _2 e _3 existem desde antes de um campo aceitar varios caminhos.
; Deixa-los em branco faz o agente avisar a cada varredura - por isso vao
; preenchidos com as pastas do CT-e OS, que usam a mesma rota.
events_upload_cte_xml_1=C:\Sistema\CTe\Eventos
events_upload_cte_xml_2=C:\Sistema\CTeOs\Eventos
events_upload_cte_xml_3=C:\Sistema\CTeOs\CCe

; --- Eventos de MDF-e (inclui o encerramento) ------------------------------
events_upload_mdfe_xml=C:\Sistema\MDFe\Evento

; --- Inutilizacao de numeracao ---------------------------------------------
inutilization_upload_nfenfce_xml_1=C:\Sistema\NFe\Inutilizacao;C:\Sistema\NFe\Xml
inutilization_upload_nfenfce_xml_2=C:\Sistema\NFCe\Inutilizacao;C:\Sistema\NFCe\xml
inutilization_upload_cte_xml=C:\Sistema\CTe\Inutilizacao;C:\Sistema\CTeOs\Inutilizada

; --- Status SEFAZ: envelopes de retorno (-pro-lot.xml / -sit.xml) ----------
; Nao e nota: e o retorno do lote/consulta, que alimenta a aba "Status SEFAZ".
; O MDF-e grava esses retornos dentro da pasta PDF - nao e engano.
status_upload_xml=C:\Sistema\NFe\Xml;C:\Sistema\NFCe\xml;C:\Sistema\MDFe\PDF;C:\Sistema\CTe\PDF

[config]
inciarwindows=1

; Reenvio TOTAL, uma vez. Use quando o portal estiver SEM documentos que o
; agente ja considera enviados (banco do portal recriado, instalacao que apontou
; para outra Url, importacao antiga perdida): o agente so reenvia o que nao esta
; marcado, entao sem isto os arquivos antigos nunca mais subiriam.
;
; Ponha 1 e salve. Na varredura seguinte o agente zera o controle local, reenvia
; TUDO e volta este campo para 0 sozinho. Nao precisa apagar o banco.sqlite.
; Custa uma varredura completa - ligue so quando precisar.
reenviar_tudo=0
